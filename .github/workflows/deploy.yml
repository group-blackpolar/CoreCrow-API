name: Deploy CoreCrow API
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      operation:
        description: Production operation
        required: true
        default: deploy
        type: choice
        options:
          - deploy
          - audit-dataset-infrastructure
          - seed-master-house-demo
      demo_account_email:
        description: Existing verified account that will own the isolated demo organization
        required: false
        type: string
      viewer_emails:
        description: Optional comma-separated existing verified accounts to add as read-only VIEWER members of the demo organization
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: corecrow-production
  cancel-in-progress: false
jobs:
  verify:
    if: github.event_name != 'workflow_dispatch' || inputs.operation == 'deploy'
    uses: ./.github/workflows/check.yml
  deploy:
    if: github.event_name != 'workflow_dispatch' || inputs.operation == 'deploy'
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bundle verified source
        run: git archive --format=tar.gz HEAD > corecrow-source.tar.gz
      - uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: corecrow-source.tar.gz
          target: /var/www/releases/corecrow-${{ github.sha }}
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 20m
          script: |
            set -eu
            cd /var/www/releases/corecrow-${{ github.sha }}
            tar -xzf corecrow-source.tar.gz
            bash scripts/deploy-vps.sh '${{ github.sha }}'
  audit-dataset-infrastructure:
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'audit-dataset-infrastructure'
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 5m
          script: |
            set -eu
            runtime=/etc/blackpolar/corecrow.env
            sudo -n test -f "$runtime"
            echo "cpu_count=$(nproc)"
            free -m | awk '/^Mem:/ { print "memory_total_mib=" $2; print "memory_available_mib=" $7 }'
            df -Pm /var/lib/docker | awk 'NR == 2 { print "docker_disk_available_mib=" $4 }'
            for name in corecrow-v1 corecrow-db corecrow-dataset-worker corecrow-minio corecrow-clamav; do
              if sudo -n docker container inspect "$name" >/dev/null 2>&1; then
                state="$(sudo -n docker inspect -f '{{.State.Status}}' "$name")"
                echo "container_${name}=${state}"
              else
                echo "container_${name}=missing"
              fi
            done
            for key in NORTH_DATA_IMPORT_WORKER_ENABLED NORTH_DATA_IMPORT_S3_BUCKET NORTH_DATA_IMPORT_S3_REGION NORTH_DATA_IMPORT_S3_ENDPOINT NORTH_DATA_IMPORT_S3_FORCE_PATH_STYLE NORTH_DATA_IMPORT_CLAMAV_SOCKET NORTH_DATA_IMPORT_CLAMAV_HOST NORTH_DATA_IMPORT_CLAMAV_PORT AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY; do
              sudo -n awk -F= -v key="$key" '
                $1 == key {
                  value = substr($0, index($0, "=") + 1)
                  gsub(/^[[:space:]\047\"]+|[[:space:]\047\"]+$/, "", value)
                  present = length(value) > 0
                }
                END { print "env_" key "=" (present ? "present" : "missing") }
              ' "$runtime"
            done
  seed-master-house-demo:
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'seed-master-house-demo'
    runs-on: ubuntu-latest
    env:
      DEMO_ACCOUNT_EMAIL: ${{ inputs.demo_account_email }}
      VIEWER_EMAILS: ${{ inputs.viewer_emails }}
    steps:
      - name: Seed isolated Master House demo
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 10m
          envs: DEMO_ACCOUNT_EMAIL,VIEWER_EMAILS
          script: |
            set -eu
            test -n "$DEMO_ACCOUNT_EMAIL"
            sudo -n docker exec corecrow-v1 node dist/seed-tenant-demo.js \
              --email "$DEMO_ACCOUNT_EMAIL" \
              --organization-slug master-house-demo \
              --organization-name "Master House Demo" \
              ${VIEWER_EMAILS:+--viewer-emails "$VIEWER_EMAILS"}
