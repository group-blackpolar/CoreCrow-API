name: Deploy CoreCrow API
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      operation:
        description: Production operation
        required: true
        default: deploy
        type: choice
        options:
          - deploy
          - audit-dataset-infrastructure
          - provision-documents-organization
      demo_account_email:
        description: Existing verified account that will own the provisioned organization
        required: false
        type: string
      documents_organization_name:
        description: Organization name for provision-documents-organization
        required: false
        default: Seminsa
        type: string
      documents_organization_slug:
        description: Organization slug for provision-documents-organization
        required: false
        default: seminsa
        type: string
      documents_prefix:
        description: Human reference prefix (2-6 capital letters) for provision-documents-organization
        required: false
        default: SEM
        type: string
permissions:
  contents: read
concurrency:
  group: corecrow-production
  cancel-in-progress: false
jobs:
  verify:
    if: github.event_name != 'workflow_dispatch' || inputs.operation == 'deploy'
    uses: ./.github/workflows/check.yml
  deploy:
    if: github.event_name != 'workflow_dispatch' || inputs.operation == 'deploy'
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bundle verified source
        run: git archive --format=tar.gz HEAD > corecrow-source.tar.gz
      - uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: corecrow-source.tar.gz
          target: /var/www/releases/corecrow-${{ github.sha }}
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 20m
          script: |
            set -eu
            cd /var/www/releases/corecrow-${{ github.sha }}
            tar -xzf corecrow-source.tar.gz
            bash scripts/deploy-vps.sh '${{ github.sha }}'
  audit-dataset-infrastructure:
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'audit-dataset-infrastructure'
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 5m
          script: |
            set -eu
            runtime=/etc/blackpolar/corecrow.env
            dataset_runtime=/etc/blackpolar/corecrow-dataset.env
            sudo -n test -f "$runtime"
            network="$(sudo -n awk -F= '
              $1 == "CORECROW_DOCKER_NETWORK" {
                value = substr($0, index($0, "=") + 1)
                gsub(/^[[:space:]\047\"]+|[[:space:]\047\"]+$/, "", value)
                configured = value
              }
              END { print configured }
            ' "$runtime")"
            network="${network:-corecrow-api_default}"
            printf '%s\n' "$network" | grep -Eq '^[A-Za-z0-9][A-Za-z0-9_.-]{0,127}$' || {
              echo 'dataset_private_network=invalid'
              exit 1
            }
            echo "cpu_count=$(nproc)"
            free -m | awk '/^Mem:/ { print "memory_total_mib=" $2; print "memory_available_mib=" $7 }'
            df -Pm /var/lib/docker | awk 'NR == 2 { print "docker_disk_available_mib=" $4 }'
            if sudo -n test -d /var/backups/blackpolar; then
              df -Pm /var/backups/blackpolar | awk 'NR == 2 { print "backup_disk_available_mib=" $4 }'
            else
              echo 'backup_disk_available_mib=missing_backup_directory'
            fi
            if sudo -n test -f "$dataset_runtime"; then
              echo 'dataset_service_runtime=present'
              echo "dataset_service_runtime_mode=$(sudo -n stat -c '%a' "$dataset_runtime")"
            else
              echo 'dataset_service_runtime=missing'
            fi
            if sudo -n docker network inspect "$network" >/dev/null 2>&1; then
              echo 'dataset_private_network=present'
            else
              echo 'dataset_private_network=missing'
            fi
            for name in corecrow-v1 corecrow-db corecrow-dataset-worker corecrow-minio corecrow-clamav; do
              if sudo -n docker container inspect "$name" >/dev/null 2>&1; then
                state="$(sudo -n docker inspect -f '{{.State.Status}}' "$name")"
                health="$(sudo -n docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$name")"
                echo "container_${name}=${state};health=${health}"
              else
                echo "container_${name}=missing"
              fi
            done
            for key in NORTH_DATA_IMPORT_WORKER_ENABLED NORTH_DATA_IMPORT_S3_BUCKET NORTH_DATA_IMPORT_S3_REGION NORTH_DATA_IMPORT_S3_ENDPOINT NORTH_DATA_IMPORT_S3_FORCE_PATH_STYLE NORTH_ASSET_S3_BUCKET NORTH_ASSET_S3_REGION NORTH_ASSET_S3_ENDPOINT NORTH_ASSET_S3_FORCE_PATH_STYLE CORECROW_CLAMAV_SOCKET CORECROW_CLAMAV_HOST CORECROW_CLAMAV_PORT CORECROW_CLAMAV_TIMEOUT_MS CORECROW_CLAMAV_MAX_BYTES AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY; do
              sudo -n awk -F= -v key="$key" '
                $1 == key {
                  value = substr($0, index($0, "=") + 1)
                  gsub(/^[[:space:]\047\"]+|[[:space:]\047\"]+$/, "", value)
                  present = length(value) > 0
                }
                END { print "env_" key "=" (present ? "present" : "missing") }
              ' "$runtime"
            done
  provision-documents-organization:
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'provision-documents-organization'
    runs-on: ubuntu-latest
    env:
      OWNER_EMAIL: ${{ inputs.demo_account_email }}
      ORGANIZATION_NAME: ${{ inputs.documents_organization_name }}
      ORGANIZATION_SLUG: ${{ inputs.documents_organization_slug }}
      DOCUMENT_PREFIX: ${{ inputs.documents_prefix }}
    steps:
      - name: Provision the document workspace (idempotent)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 5m
          envs: OWNER_EMAIL,ORGANIZATION_NAME,ORGANIZATION_SLUG,DOCUMENT_PREFIX
          script: |
            set -eu
            test -n "$OWNER_EMAIL"
            sudo -n docker exec corecrow-v1 node dist/provision-documents.js \
              --email "$OWNER_EMAIL" \
              --organization-slug "$ORGANIZATION_SLUG" \
              --organization-name "$ORGANIZATION_NAME" \
              --prefix "$DOCUMENT_PREFIX"
