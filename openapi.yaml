  /v1/identity/verification/send:
    post:
      summary: Send or replace a single-use six-digit email verification code
      tags:
        - Identity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                  maxLength: 254
              required:
                - email
              additionalProperties: false
      security: []
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  accepted:
                    type: boolean
                    enum:
                      - true
                required:
                  - accepted
                additionalProperties: false
        4XX:
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      message:
                        type: string
                      requestId:
                        type: string
                      currentRevision:
                        type: integer
                        minimum: 1
                      currentETag:
                        type: string
                    required:
                      - code
                      - message
                      - requestId
                    additionalProperties: false
                required:
                  - error
                additionalProperties: false
        5XX:
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      message:
                        type: string
                      requestId:
                        type: string
                      currentRevision:
                        type: integer
                        minimum: 1
                      currentETag:
                        type: string
                    required:
                      - code
                      - message
                      - requestId
                    additionalProperties: false
                required:
                  - error
                additionalProperties: false
  /v1/identity/verification/confirm:
    post:
      summary: Confirm a single-use six-digit email verification code
      tags:
        - Identity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                  maxLength: 254
                code:
                  type: string
                  pattern: ^\d{6}$
              required:
                - email
                - code
              additionalProperties: false
      security: []
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  verified:
                    type: boolean
                    enum:
                      - true
                required:
                  - verified
                additionalProperties: false
        4XX:
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      message:
                        type: string
                      requestId:
                        type: string
                      currentRevision:
                        type: integer
                        minimum: 1
                      currentETag:
                        type: string
                    required:
                      - code
                      - message
                      - requestId
                    additionalProperties: false
                required:
                  - error
                additionalProperties: false
        5XX:
