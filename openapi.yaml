openapi: 3.0.3
info:
  title: CORECROW API
  version: 1.0.0
  description: Black Polar shared backend. Cookie identity, tenant membership
    authorization, and audited contract commerce. Public contracts use /v1.
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Secure-better-auth.session_token
      description: Better Auth cookie; development uses better-auth.session_token.
  schemas: {}
paths:
  /:
    get:
      responses:
        "200":
          description: Default Response
  /health:
    get:
      responses:
        "200":
          description: Default Response
  /v1/health:
    get:
      summary: Dependency readiness and process uptime
      tags:
        - Health
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                      - operational
                      - degraded
                  apiVersion:
                    type: string
                    enum:
                      - v1
                  uptimeSeconds:
                    type: integer
                    minimum: 0
                  checkedAt:
                    type: string
                    format: date-time
                  modules:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                        status:
                          type: string
                          enum:
                            - available
                            - unavailable
                      required:
                        - name
                        - status
                      additionalProperties: false
                  emailDelivery:
                    type: string
                    enum:
                      - configured
                      - not_configured
                  emailTransport:
                    type: string
                    enum:
                      - available
                      - unavailable
                      - not_configured
                  commerceMode:
                    type: string
                    enum:
                      - contract_provisioning
                required:
                  - status
                  - apiVersion
                  - uptimeSeconds
                  - checkedAt
                  - modules
                  - emailDelivery
                  - emailTransport
                  - commerceMode
                additionalProperties: false
        "503":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                      - operational
                      - degraded
                  apiVersion:
                    type: string
                    enum:
                      - v1
                  uptimeSeconds:
                    type: integer
                    minimum: 0
                  checkedAt:
                    type: string
                    format: date-time
                  modules:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                        status:
                          type: string
                          enum:
                            - available
                            - unavailable
                      required:
                        - name
                        - status
                      additionalProperties: false
                  emailDelivery:
                    type: string
                    enum:
                      - configured
                      - not_configured
                  emailTransport:
                    type: string
                    enum:
                      - available
                      - unavailable
                      - not_configured
                  commerceMode:
                    type: string
                    enum:
                      - contract_provisioning
                required:
                  - status
                  - apiVersion
                  - uptimeSeconds
                  - checkedAt
                  - modules
                  - emailDelivery
                  - emailTransport
                  - commerceMode
                additionalProperties: false
  /v1/status/summary:
    get:
      summary: Sanitized aggregate process traffic for the public status page
      tags:
        - Health
      parameters:
        - schema:
            type: string
            enum:
              - 1h
              - 6h
              - 24h
            default: 24h
          in: query
          name: window
          required: false
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  window:
                    type: string
                    enum:
                      - 1h
                      - 6h
                      - 24h
                  bucketSeconds:
                    type: integer
                    minimum: 1
                  generatedAt:
                    type: string
                    format: date-time
                  observedSince:
                    $ref: "#/properties/generatedAt"
                  coverageSeconds:
                    type: integer
                    minimum: 1
                  uptimeSeconds:
                    type: integer
                    minimum: 0
                  requests:
                    type: integer
                    minimum: 0
                  requestsPerSecond:
                    type: number
                    minimum: 0
                  latencyMs:
                    type: object
                    properties:
                      average:
                        type: number
                        minimum: 0
                        nullable: true
                      p50:
                        type: number
                        minimum: 0
                        nullable: true
                      p95:
                        type: number
                        minimum: 0
                        nullable: true
                    required:
                      - average
                      - p50
                      - p95
                    additionalProperties: false
                  errors:
                    type: object
                    properties:
                      client:
                        type: integer
                        minimum: 0
                      server:
                        type: integer
                        minimum: 0
                    required:
                      - client
                      - server
                    additionalProperties: false
                  series:
                    type: array
                    items:
                      type: object
                      properties:
                        startedAt:
                          $ref: "#/properties/generatedAt"
                        requests:
                          type: integer
                          minimum: 0
                        averageLatencyMs:
                          type: number
                          minimum: 0
                          nullable: true
                        errors4xx:
                          type: integer
                          minimum: 0
                        errors5xx:
                          type: integer
                          minimum: 0
                      required:
                        - startedAt
                        - requests
                        - averageLatencyMs
                        - errors4xx
                        - errors5xx
                      additionalProperties: false
                required:
                  - window
                  - bucketSeconds
                  - generatedAt
                  - observedSince
                  - coverageSeconds
                  - uptimeSeconds
                  - requests
                  - requestsPerSecond
                  - latencyMs
                  - errors
                  - series
                additionalProperties: false
  /v1/live:
    get:
      summary: Process liveness (no dependency check)
      tags:
        - Health
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - apiVersion
                properties:
                  status:
                    enum:
                      - alive
                  apiVersion:
                    enum:
                      - v1
  /v1/openapi.json:
    get:
      responses:
        "200":
          description: Default Response
  /v1/auth/{*}:
    get: &a1
      parameters:
        - schema:
            type: string
          in: path
          name: "*"
          required: true
      responses:
        "200":
          description: Default Response
    head: *a1
    trace: *a1
    delete: *a1
    options: *a1
    patch: *a1
    put: *a1
    post: *a1
  /v1/desktop-auth/google/start:
    get:
      summary: Start Google authentication in the system browser for North desktop
      tags:
        - Identity
      parameters:
        - schema:
            type: string
            pattern: ^[a-f0-9]{64}$
          in: query
          name: nonce
          required: true
        - schema:
            $ref: "#/properties/nonce"
          in: query
          name: challenge
          required: true
        - schema:
            type: string
            enum:
              - "0"
              - "1"
            default: "0"
          in: query
          name: signup
          required: false
      responses:
        "200":
          description: Default Response
  /v1/desktop-auth/google/complete:
    get:
      summary: Finish browser authentication and return a one-time code to North
      tags:
        - Identity
      parameters:
        - schema:
            type: string
            pattern: ^[a-f0-9]{64}$
          in: query
          name: nonce
          required: true
      responses:
        "200":
          description: Default Response
  /v1/desktop-auth/google/error:
    get:
      summary: Return a sanitized OAuth error to North desktop
      tags:
        - Identity
      parameters:
        - schema:
            type: string
            pattern: ^[a-f0-9]{64}$
          in: query
          name: nonce
          required: true
        - schema:
            type: string
            maxLength: 80
          in: query
          name: error
          required: false
      responses:
        "200":
          description: Default Response
  /v1/desktop-auth/exchange:
    post:
      summary: Exchange a single-use desktop OAuth code using its PKCE verifier
      tags:
        - Identity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                code:
                  type: string
                  pattern: ^[a-f0-9]{64}$
                verifier:
                  $ref: "#/properties/code"
              required:
                - code
                - verifier
              additionalProperties: false
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                  user:
                    type: object
                    properties:
                      id:
                        type: string
                        minLength: 1
                        maxLength: 128
                      name:
                        type: string
                        nullable: true
                      email:
                        type: string
                        format: email
                      role:
                        type: string
                        enum:
                          - USER
                          - DEVELOPER
                          - ADMIN
                          - SUPERADMIN
                      status:
                        type: string
                        enum:
                          - ACTIVE
                          - SUSPENDED
                      emailVerified:
                        type: boolean
                      passwordChangeRequired:
                        type: boolean
                      termsAcceptedAt:
                        type: string
                        format: date-time
                        nullable: true
                      termsVersion:
                        type: string
                        nullable: true
                      createdAt:
                        $ref: "#/properties/user/properties/termsAcceptedAt"
                    required:
                      - id
                      - name
                      - email
                      - role
                      - status
                      - emailVerified
                      - passwordChangeRequired
                      - termsAcceptedAt
                      - termsVersion
                      - createdAt
                    additionalProperties: false
                required:
                  - token
                  - user
                additionalProperties: false
  /v1/desktop-auth/session:
    delete:
      summary: Revoke the current North desktop session
      tags:
        - Identity
      responses:
        "204":
          description: Default Response
  /v1/organizations/{organizationId}/assets/uploads:
    post:
      summary: Reserve quota and request a checksum-bound signed asset upload
      tags:
        - NORTH assets
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                filename:
                  type: string
                  minLength: 1
                  maxLength: 255
                mime:
                  type: string
                  minLength: 1
                  maxLength: 127
                size:
                  type: integer
                  minimum: 1
                checksum:
                  type: string
                  pattern: ^[0-9a-fA-F]{64}$
              required:
                - filename
                - mime
                - size
                - checksum
              additionalProperties: false
      parameters:
        - schema:
            type: string
            minLength: 1
            maxLength: 128
          in: path
          name: organizationId
          required: true
      security:
        - sessionCookie: []
      responses:
        "201":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  asset:
                    type: object
                    properties:
                      id:
                        type: string
                        minLength: 1
                        maxLength: 128
                      organizationId:
                        type: string
                        minLength: 1
                        maxLength: 128
                      ownerId:
                        type: string
                        minLength: 1
                        maxLength: 128
                      filename:
                        type: string
                        minLength: 1
                        maxLength: 255
                      mime:
                        type: string
                      size:
                        type: integer
                        minimum: 1
                      checksum:
                        type: string
                        pattern: ^[0-9a-f]{64}$
                      status:
                        type: string
                        enum:
                          - UPLOADING
                          - PROCESSING
                          - READY
                          - REJECTED
                          - QUARANTINED
                      confirmedAt:
                        type: string
                        format: date-time
                        nullable: true
                      deletedAt:
                        type: string
                        format: date-time
                        nullable: true
                      createdAt:
                        type: string
                        format: date-time
                      updatedAt:
                        type: string
                        format: date-time
                    required:
                      - id
                      - organizationId
                      - ownerId
                      - filename
                      - mime
                      - size
                      - checksum
                      - status
                      - confirmedAt
                      - deletedAt
                      - createdAt
                      - updatedAt
                    additionalProperties: false
                  upload:
                    type: object
                    properties:
                      url:
                        type: string
                        format: uri
                      method:
                        type: string
                        enum:
                          - PUT
                          - GET
                      headers:
                        type: object
                        additionalProperties:
                          type: string
                      expiresAt:
                        type: string
                        format: date-time
                    required:
                      - url
                      - method
                      - headers
                      - expiresAt
                    additionalProperties: false
                required:
                  - asset
                  - upload
                additionalProperties: false
        4XX:
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      message:
                        type: string
                      requestId:
                        type: string
                      currentRevision:
                        type: integer
                        minimum: 1
                      currentETag:
                        type: string
                    required:
                      - code
                      - message
                      - requestId
                    additionalProperties: false
                required:
                  - error
                additionalProperties: false
        5XX:
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      message:
                        type: string
                      requestId:
                        type: string
                      currentRevision:
                        type: integer
                        minimum: 1
                      currentETag:
                        type: string
                    required:
                      - code
                      - message
                      - requestId
                    additionalProperties: false
                required:
                  - error
                additionalProperties: false
