# Included inside the api.blackpolar.org server{} block (install as /etc/nginx/snippets/corecrow-storage.conf).
# Publishes ONLY presigned object operations of the private MinIO (published on 127.0.0.1:9000, never on a public port).
# The presigned URL carries the signature, so nginx must forward the exact path and Host the SDK signed: path-style on
# api.blackpolar.org, no rewriting. Anything unsigned, off the application prefixes, or with another method is refused here.

location ~ ^/corecrow-assets/(north-assets|user-avatars)/ {
    client_max_body_size 260m;
    include /etc/nginx/snippets/corecrow-storage-proxy.conf;
}
location ~ ^/corecrow-dataset-imports/north-data-imports/ {
    client_max_body_size 52m;
    include /etc/nginx/snippets/corecrow-storage-proxy.conf;
}
