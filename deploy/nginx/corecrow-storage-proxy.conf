# Shared body of the two storage locations (install as /etc/nginx/snippets/corecrow-storage-proxy.conf).
if ($request_method = OPTIONS) {
    add_header Access-Control-Allow-Origin $corecrow_storage_origin always;
    add_header Access-Control-Allow-Methods "GET, PUT, HEAD, OPTIONS" always;
    add_header Access-Control-Allow-Headers "content-type, content-length, x-amz-checksum-sha256, x-amz-sdk-checksum-algorithm, x-amz-content-sha256, x-amz-date" always;
    add_header Access-Control-Max-Age 600 always;
    add_header Vary Origin always;
    return 204;
}
if ($request_method !~ ^(GET|PUT|HEAD)$) { return 405; }
if ($args !~ "(^|&)X-Amz-Signature=") { return 403; }

add_header Access-Control-Allow-Origin $corecrow_storage_origin always;
add_header Access-Control-Expose-Headers "ETag, x-amz-version-id, x-amz-checksum-sha256" always;
add_header Vary Origin always;
add_header X-Content-Type-Options "nosniff" always;
add_header Cache-Control "private, no-store" always;

proxy_pass http://127.0.0.1:9000;
proxy_http_version 1.1;
proxy_set_header Host $http_host;
proxy_set_header Connection "";
proxy_request_buffering off;
proxy_buffering off;
proxy_connect_timeout 5s;
proxy_send_timeout 300s;
proxy_read_timeout 300s;
